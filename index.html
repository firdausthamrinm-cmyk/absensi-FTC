<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Absensi Atlet FTC</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:0;font-family:Arial,sans-serif;background:#f2f4f7;text-align:center}
.container{width:100%;max-width:500px;margin:auto;padding:15px}h1{margin:5px 0;font-size:24px}.subtitle{color:#666;margin-bottom:15px}
#reader{width:100%;max-width:430px;margin:auto;background:#000;border-radius:15px;overflow:hidden}
#reader video{width:100%!important;height:auto!important}.status{margin-top:15px;padding:14px;border-radius:10px;background:white}
.info{background:#e0f2fe;color:#075985}.success{background:#d1fae5;color:#065f46}.error{background:#fee2e2;color:#991b1b}.warning{background:#fef3c7;color:#92400e}
.nama{font-size:22px;font-weight:bold;margin-top:8px}.kode{margin-top:5px;color:#555}.jam{margin-top:5px;color:#666}.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h1>ABSENSI ATLET FTC</h1>
<div class="subtitle">Arahkan QR Code ke kamera</div>
<div id="reader"></div>
<div id="status" class="status info">Memeriksa kamera...</div>
<div id="hasil" class="status hidden">
<div id="hasilIcon"></div><div id="hasilNama" class="nama"></div>
<div id="hasilKode" class="kode"></div><div id="hasilJam" class="jam"></div>
</div>
</div>

<script>
/*
 * URL WEB APP ABSENSI BAPAK
 */
const API_URL='https://script.google.com/macros/s/AKfycbztP46ZHQcF9lOqFDFbilVj9eOgBvlpRxd4CgsMpikqbD4DyBhKTlEYu3kww_nR9EOl/exec';

let scanner=null, scannerAktif=false, sedangMemproses=false;

function tampilStatus(pesan,tipe='info'){
  const el=document.getElementById('status');
  el.textContent=pesan;
  el.className='status '+tipe;
}
function tampilHasil(icon,nama,kode,jam,tipe){
  document.getElementById('hasil').className='status '+tipe;
  document.getElementById('hasilIcon').textContent=icon;
  document.getElementById('hasilNama').textContent=nama||'';
  document.getElementById('hasilKode').textContent=kode?'Kode: '+kode:'';
  document.getElementById('hasilJam').textContent=jam||'';
}
function sembunyikanHasil(){document.getElementById('hasil').className='status hidden';}

async function mulaiScanner(){
  if(scannerAktif)return;
  try{
    tampilStatus('Meminta izin kamera...','info');

    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}},audio:false
    });
    stream.getTracks().forEach(track=>track.stop());

    tampilStatus('Mencari kamera...','info');
    const cameras=await Html5Qrcode.getCameras();
    if(!cameras||!cameras.length)throw new Error('Tidak ada kamera yang ditemukan.');

    let kamera=cameras.find(c=>{
      const label=String(c.label||'').toLowerCase();
      return label.includes('back')||label.includes('rear')||
             label.includes('environment')||label.includes('belakang');
    });
    if(!kamera)kamera=cameras[cameras.length-1];

    scanner=new Html5Qrcode('reader');

    const config={
      fps:10,
      qrbox:(width,height)=>{
        const ukuran=Math.floor(Math.min(width,height)*0.70);
        return {width:ukuran,height:ukuran};
      }
    };

    await scanner.start(kamera.id,config,ketikaQRTerbaca,()=>{});
    scannerAktif=true;
    tampilStatus('Kamera siap. Arahkan QR atlet.','info');

  }catch(error){
    console.error(error);
    scannerAktif=false;
    let pesan='Kamera tidak dapat digunakan.';
    if(error.name==='NotAllowedError')pesan='Izin kamera ditolak. Izinkan kamera untuk situs ini.';
    else if(error.name==='NotFoundError')pesan='Kamera tidak ditemukan pada perangkat.';
    else if(error.name==='NotReadableError')pesan='Kamera sedang digunakan aplikasi lain.';
    else if(error.name==='SecurityError')pesan='Browser memblokir kamera. Pastikan halaman menggunakan HTTPS.';
    else if(error.message)pesan+=' '+error.message;
    tampilStatus(pesan,'error');
  }
}

function ambilKodeAtletDariQR(decodedText){
  const teks=String(decodedText||'').trim();

  // 1. Jika QR langsung berisi kode seperti TKD1
  if(/^TKD\\d+$/i.test(teks)){
    return teks.toUpperCase();
  }

  // 2. Jika QR berisi URL Google Form pre-filled seperti:
  // ...viewform?entry.2087991553=TKD1&entry.527279397=HADIR
  try{
    const url=new URL(teks);
    const parameterKode=url.searchParams.get('entry.2087991553');
    if(parameterKode && /^TKD\\d+$/i.test(parameterKode.trim())){
      return parameterKode.trim().toUpperCase();
    }

    // 3. Cadangan: cari parameter entry yang nilainya berbentuk TKD1, TKD2, dst.
    for(const [nama,nilai] of url.searchParams.entries()){
      if(/^TKD\\d+$/i.test(String(nilai).trim())){
        return String(nilai).trim().toUpperCase();
      }
    }
  }catch(e){
    // Bukan URL, lanjutkan pemeriksaan biasa.
  }

  return null;
}

function ketikaQRTerbaca(decodedText){
  if(sedangMemproses)return;
  sedangMemproses=true;

  const kode=ambilKodeAtletDariQR(decodedText);

  hentikanScanner();
  sembunyikanHasil();

  if(!kode){
    tampilStatus('❌ QR terbaca, tetapi kode atlet tidak ditemukan.','error');
    tampilHasil(
      '❌',
      '',
      String(decodedText||'').substring(0,80),
      'QR harus berisi kode seperti TKD1 atau QR Google Form yang memuat kode atlet.',
      'error'
    );
    setTimeout(mulaiLagi,3000);
    return;
  }

  tampilStatus('QR terbaca: '+kode+'. Menyimpan absensi...','info');
  kirimAbsensi(kode);
}

/*
 * Menggunakan JSONP agar halaman GitHub Pages dapat
 * meminta respons dari Web App Apps Script.
 */
function kirimAbsensi(kode){
  const callbackName='absenCallback_'+Date.now()+'_'+Math.floor(Math.random()*100000);
  const script=document.createElement('script');
  let selesai=false;

  window[callbackName]=function(hasil){
    selesai=true;
    prosesHasil(hasil,kode);
    bersihkan();
  };

  function bersihkan(){
    delete window[callbackName];
    if(script.parentNode)script.parentNode.removeChild(script);
  }

  script.onerror=function(){
    if(selesai)return;
    bersihkan();
    tampilStatus('Tidak dapat terhubung ke server absensi.','error');
    tampilHasil('❌','',kode,'Periksa Web App Code.gs.','error');
    setTimeout(mulaiLagi,3000);
  };

  const url=API_URL+
    '?action=absen'+
    '&kode='+encodeURIComponent(kode)+
    '&callback='+encodeURIComponent(callbackName);

  script.src=url;
  document.body.appendChild(script);
}

function prosesHasil(hasil,kode){
  if(!hasil){
    tampilStatus('Tidak ada respons dari server.','error');
    setTimeout(mulaiLagi,3000);
    return;
  }

  if(hasil.berhasil===true){
    tampilStatus('✓ ABSENSI BERHASIL','success');
    tampilHasil('✓',hasil.nama,hasil.kode||kode,
      hasil.jam?'Jam: '+hasil.jam:'Absensi tercatat','success');
    setTimeout(mulaiLagi,3000);
    return;
  }

  if(hasil.tipe==='SUDAH_ABSEN'){
    tampilStatus('⚠ SUDAH ABSEN','warning');
    tampilHasil('⚠️',hasil.nama||'',hasil.kode||kode,
      hasil.pesan||'Atlet sudah absen.','warning');
    setTimeout(mulaiLagi,3000);
    return;
  }

  if(hasil.tipe==='TIDAK_DITEMUKAN'){
    tampilStatus('❌ QR TIDAK TERDAFTAR','error');
    tampilHasil('❌','',kode,
      hasil.pesan||'Kode atlet tidak ditemukan.','error');
    setTimeout(mulaiLagi,3000);
    return;
  }

  if(hasil.tipe==='JADWAL'){
    tampilStatus('⏰ ABSENSI BELUM DIBUKA','warning');
    tampilHasil('⏰','',kode,hasil.pesan||'','warning');
    setTimeout(mulaiLagi,3000);
    return;
  }

  tampilStatus(hasil.pesan||'Absensi gagal.','error');
  tampilHasil('❌',hasil.nama||'',hasil.kode||kode,hasil.pesan||'','error');
  setTimeout(mulaiLagi,3000);
}

async function hentikanScanner(){
  if(!scanner||!scannerAktif)return;
  try{await scanner.stop();}catch(error){console.error(error);}
  scannerAktif=false;
}

async function mulaiLagi(){
  sedangMemproses=false;
  sembunyikanHasil();
  scanner=null;
  tampilStatus('Menyalakan kamera...','info');
  await mulaiScanner();
}

window.addEventListener('load',()=>mulaiScanner());
</script>
</body>
</html>
