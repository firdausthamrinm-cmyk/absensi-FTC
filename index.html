<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Absensi Atlet FTC</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0;font-family:Arial,sans-serif;background:#f2f4f7;text-align:center}
.container{width:100%;max-width:500px;margin:auto;padding:15px}
h1{margin:5px 0;font-size:24px}
.subtitle{color:#666;margin-bottom:15px}
#reader{width:100%;max-width:430px;margin:auto;background:#000;border-radius:15px;overflow:hidden}
#reader video{width:100%!important;height:auto!important}
.status{margin-top:15px;padding:14px;border-radius:10px;background:white}
.info{background:#e0f2fe;color:#075985}
.success{background:#d1fae5;color:#065f46}
.error{background:#fee2e2;color:#991b1b}
.warning{background:#fef3c7;color:#92400e}
.nama{font-size:22px;font-weight:bold;margin-top:8px}
.kode{margin-top:5px;color:#555}
.jam{margin-top:5px;color:#666}
.hidden{display:none}
.sound-note{font-size:12px;color:#777;margin-top:8px}
</style>
</head>
<body>

<div class="container">
  <h1>ABSENSI ATLET FTC</h1>
  <div class="subtitle">Arahkan QR Code ke kamera</div>
  <div id="reader"></div>
  <div id="status" class="status info">Memeriksa kamera...</div>
  <div id="hasil" class="status hidden">
    <div id="hasilIcon"></div>
    <div id="hasilNama" class="nama"></div>
    <div id="hasilKode" class="kode"></div>
    <div id="hasilJam" class="jam"></div>
  </div>
  <button id="tesSuara" type="button"
      onclick="tesSuara()"
      style="margin-top:10px;padding:10px 18px;border:0;border-radius:8px;cursor:pointer;font-weight:bold;">
      🔊 Tes Suara
    </button>
    <div class="sound-note">
      Tekan sekali untuk mengaktifkan suara. Volume beep dapat disesuaikan dari kode.
    </div>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbztP46ZHQcF9lOqFDFbilVj9eOgBvlpRxd4CgsMpikqbD4DyBhKTlEYu3kww_nR9EOl/exec';

let scanner=null, scannerAktif=false, sedangMemproses=false;
let audioContext=null;
let suaraSiap=false;

/* =========================
   SISTEM BEEP
   ========================= */
function siapkanSuara(){
  try{
    if(!audioContext){
      const AudioCtx=window.AudioContext||window.webkitAudioContext;
      if(!AudioCtx)return;
      audioContext=new AudioCtx();
    }
    if(audioContext.state==='suspended'){
      audioContext.resume();
    }
    suaraSiap=true;
  }catch(e){
    console.log('Audio tidak tersedia:',e);
  }
}

function beep(frekuensi=880,durasi=120,jeda=0){
  if(!suaraSiap || !audioContext)return;

  try{
    const mulai=audioContext.currentTime+jeda/1000;
    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();

    osc.type='sine';
    osc.frequency.setValueAtTime(frekuensi,mulai);

    gain.gain.setValueAtTime(0.0001,mulai);
    gain.gain.exponentialRampToValueAtTime(0.65,mulai+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001,mulai+durasi/1000);

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start(mulai);
    osc.stop(mulai+durasi/1000+0.03);
  }catch(e){
    console.log('Beep gagal:',e);
  }
}

function tesSuara(){
  siapkanSuara();

  // Tes suara: dua nada yang jelas.
  beep(1000,180,0);
  beep(1400,220,230);

  const tombol=document.getElementById('tesSuara');
  if(tombol){
    const teksLama=tombol.textContent;
    tombol.textContent='🔊 Suara Aktif';
    setTimeout(()=>{tombol.textContent=teksLama;},1500);
  }
}

function beepBacaQR(){
  beep(1000,110);
}

function beepBerhasil(){
  beep(880,120,0);
  beep(1320,160,150);
}

function beepPeringatan(){
  beep(600,180,0);
  beep(600,180,220);
}

function beepGagal(){
  beep(300,250,0);
}

/* Sentuhan pertama mengaktifkan audio pada browser. */
window.addEventListener('pointerdown',siapkanSuara,{once:true});
window.addEventListener('touchstart',siapkanSuara,{once:true});
window.addEventListener('keydown',siapkanSuara,{once:true});

function tampilStatus(pesan,tipe='info'){
  const el=document.getElementById('status');
  el.textContent=pesan;
  el.className='status '+tipe;
}

function tampilHasil(icon,nama,kode,jam,tipe){
  document.getElementById('hasil').className='status '+tipe;
  document.getElementById('hasilIcon').textContent=icon;
  document.getElementById('hasilNama').textContent=nama||'';
  document.getElementById('hasilKode').textContent=kode?'Kode: '+kode:'';
  document.getElementById('hasilJam').textContent=jam||'';
}

function sembunyikanHasil(){
  document.getElementById('hasil').className='status hidden';
}

/* =========================
   SCANNER
   ========================= */
async function mulaiScanner(){
  if(scannerAktif)return;

  try{
    tampilStatus('Meminta izin kamera...','info');

    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}},
      audio:false
    });

    stream.getTracks().forEach(track=>track.stop());

    tampilStatus('Mencari kamera...','info');

    const cameras=await Html5Qrcode.getCameras();
    if(!cameras||!cameras.length){
      throw new Error('Tidak ada kamera yang ditemukan.');
    }

    let kamera=cameras.find(c=>{
      const label=String(c.label||'').toLowerCase();
      return label.includes('back')||
             label.includes('rear')||
             label.includes('environment')||
             label.includes('belakang');
    });

    if(!kamera)kamera=cameras[cameras.length-1];

    scanner=new Html5Qrcode('reader');

    const config={
      fps:10,
      qrbox:(width,height)=>{
        const ukuran=Math.floor(Math.min(width,height)*0.70);
        return {width:ukuran,height:ukuran};
      }
    };

    await scanner.start(
      kamera.id,
      config,
      ketikaQRTerbaca,
      ()=>{}
    );

    scannerAktif=true;
    tampilStatus('Kamera siap. Arahkan QR atlet.','info');

  }catch(error){
    console.error(error);
    scannerAktif=false;

    let pesan='Kamera tidak dapat digunakan.';

    if(error.name==='NotAllowedError'){
      pesan='Izin kamera ditolak. Izinkan kamera untuk situs ini.';
    }else if(error.name==='NotFoundError'){
      pesan='Kamera tidak ditemukan pada perangkat.';
    }else if(error.name==='NotReadableError'){
      pesan='Kamera sedang digunakan aplikasi lain.';
    }else if(error.name==='SecurityError'){
      pesan='Browser memblokir kamera. Pastikan halaman menggunakan HTTPS.';
    }else if(error.message){
      pesan+=' '+error.message;
    }

    tampilStatus(pesan,'error');
  }
}

/* =========================
   AMBIL KODE DARI QR
   ========================= */
function ambilKodeAtletDariQR(decodedText){
  const teks=String(decodedText||'').trim();

  if(/^TKD\d+$/i.test(teks)){
    return teks.toUpperCase();
  }

  try{
    const url=new URL(teks);

    const parameterKode=url.searchParams.get('entry.2087991553');

    if(parameterKode && /^TKD\d+$/i.test(parameterKode.trim())){
      return parameterKode.trim().toUpperCase();
    }

    for(const [nama,nilai] of url.searchParams.entries()){
      if(/^TKD\d+$/i.test(String(nilai).trim())){
        return String(nilai).trim().toUpperCase();
      }
    }
  }catch(e){}

  const cocok=teks.match(/\bTKD\d+\b/i);
  if(cocok){
    return cocok[0].toUpperCase();
  }

  return null;
}

function ketikaQRTerbaca(decodedText){
  if(sedangMemproses)return;

  sedangMemproses=true;

  const kode=ambilKodeAtletDariQR(decodedText);

  /* Beep pertama: QR berhasil terbaca */
  beepBacaQR();

  hentikanScanner();
  sembunyikanHasil();

  if(!kode){
    beepGagal();
    tampilStatus('❌ QR terbaca, tetapi kode atlet tidak ditemukan.','error');

    tampilHasil(
      '❌',
      '',
      String(decodedText||'').substring(0,80),
      'QR harus berisi kode seperti TKD1.',
      'error'
    );

    setTimeout(mulaiLagi,3000);
    return;
  }

  tampilStatus('QR terbaca: '+kode+'. Menyimpan absensi...','info');
  kirimAbsensi(kode);
}

/* =========================
   KIRIM KE CODE.GS
   ========================= */
function kirimAbsensi(kode){
  const callbackName=
    'absenCallback_'+Date.now()+'_'+
    Math.floor(Math.random()*100000);

  const script=document.createElement('script');
  let selesai=false;

  window[callbackName]=function(hasil){
    selesai=true;
    prosesHasil(hasil,kode);
    bersihkan();
  };

  function bersihkan(){
    delete window[callbackName];
    if(script.parentNode)script.parentNode.removeChild(script);
  }

  script.onerror=function(){
    if(selesai)return;

    bersihkan();
    beepGagal();

    tampilStatus(
      'Tidak dapat terhubung ke server absensi.',
      'error'
    );

    tampilHasil(
      '❌','',kode,
      'Periksa Web App Code.gs.',
      'error'
    );

    setTimeout(mulaiLagi,3000);
  };

  const url=
    API_URL+
    '?action=absen'+
    '&kode='+encodeURIComponent(kode)+
    '&callback='+encodeURIComponent(callbackName);

  script.src=url;
  document.body.appendChild(script);
}

/* =========================
   HASIL ABSENSI
   ========================= */
function prosesHasil(hasil,kode){
  if(!hasil){
    beepGagal();
    tampilStatus('Tidak ada respons dari server.','error');
    setTimeout(mulaiLagi,3000);
    return;
  }

  if(hasil.berhasil===true){
    /* Dua beep: absensi berhasil */
    beepBerhasil();

    tampilStatus('✓ ABSENSI BERHASIL','success');

    tampilHasil(
      '✓',
      hasil.nama,
      hasil.kode||kode,
      hasil.jam?'Jam: '+hasil.jam:'Absensi tercatat',
      'success'
    );

    setTimeout(mulaiLagi,3000);
    return;
  }

  if(hasil.tipe==='SUDAH_ABSEN'){
    beepPeringatan();

    tampilStatus('⚠ SUDAH ABSEN','warning');

    tampilHasil(
      '⚠️',
      hasil.nama||'',
      hasil.kode||kode,
      hasil.pesan||'Atlet sudah absen.',
      'warning'
    );

    setTimeout(mulaiLagi,3000);
    return;
  }

  if(hasil.tipe==='TIDAK_DITEMUKAN'){
    beepGagal();

    tampilStatus('❌ QR TIDAK TERDAFTAR','error');

    tampilHasil(
      '❌','',kode,
      hasil.pesan||'Kode atlet tidak ditemukan.',
      'error'
    );

    setTimeout(mulaiLagi,3000);
    return;
  }

  if(hasil.tipe==='JADWAL'){
    beepPeringatan();

    tampilStatus('⏰ ABSENSI BELUM DIBUKA','warning');

    tampilHasil(
      '⏰','',kode,
      hasil.pesan||'',
      'warning'
    );

    setTimeout(mulaiLagi,3000);
    return;
  }

  beepGagal();

  tampilStatus(
    hasil.pesan||'Absensi gagal.',
    'error'
  );

  tampilHasil(
    '❌',
    hasil.nama||'',
    hasil.kode||kode,
    hasil.pesan||'',
    'error'
  );

  setTimeout(mulaiLagi,3000);
}

async function hentikanScanner(){
  if(!scanner||!scannerAktif)return;

  try{
    await scanner.stop();
  }catch(error){
    console.error(error);
  }

  scannerAktif=false;
}

async function mulaiLagi(){
  sedangMemproses=false;
  sembunyikanHasil();
  scanner=null;
  tampilStatus('Menyalakan kamera...','info');
  await mulaiScanner();
}

window.addEventListener('load',()=>{
  mulaiScanner();
});
</script>

</body>
</html>
